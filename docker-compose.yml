services:
  # App
  edunexa-app:
    build:
      context: .
      dockerfile: php/Dockerfile
    container_name: edunexa-app
    restart: unless-stopped
    working_dir: /var/www/html/edunexa
    volumes:
      - .:/var/www/html
    networks:
      - edunexa-network

  # Server
  edunexa-nginx:
    image: nginx:alpine
    container_name: edunexa-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - edunexa-app
    networks:
      - edunexa-network

  # Database
  edunexa-mysql:
    image: mysql:8.0
    container_name: edunexa-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: edunexa_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    networks:
      - edunexa-network

  # Cache
  edunexa-redis:
    image: redis:alpine
    container_name: edunexa-redis
    restart: unless-stopped
    networks:
      - edunexa-network

networks:
  edunexa-network:
    driver: bridge
